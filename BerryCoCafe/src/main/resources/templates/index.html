<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berry Co Cafe</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">
    <h1>🍓 Berry Co Cafe</h1>
    <p class="subtitle">Menu Management Dashboard</p>

    <form id="menu-form">
        <input type="text" id="name" placeholder="Item name" required>
        <input type="text" id="category" placeholder="Category" required>
        <input type="number" id="price" step="0.01" min="0.1" placeholder="Price" required>
        <button type="submit">Add Item</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="menu-table-body"></tbody>
    </table>
</div>

<script src="/app.js"></script>
</body>
</html>
